[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nikatel-panel"
version = "0.1.0"
description = "Nikatel control panel: servers, tunnels, configs, panels and the shop bot - rebuilt with a clean architecture."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.4",
    "itsdangerous>=2.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nikatel = "nikatel.main:cli"

[tool.setuptools.packages.find]
include = ["nikatel*"]

[tool.setuptools.package-data]
nikatel = ["web/*", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
